[project]
name = "french-tutor"
version = "0.1.0"
description = "Personal French tutoring assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio==6.30.0",
    "huggingface-hub>=2.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
