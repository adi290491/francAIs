name: Deploy to Hugging Face Space

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-to-hf
  cancel-in-progress: true

env:
  HF_USERNAME: your-hf-username # TODO: set to your Hugging Face username
  SPACE_NAME: french-tutor # TODO: set to your Space name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push master to the Space's main branch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}" \
            HEAD:main
